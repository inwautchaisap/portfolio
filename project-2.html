    <style>
        /* --- Chatbot CSS --- */
        .chatbot_section {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 500px;
            /* ความสูง fixed */
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
            word-wrap: break-word;
            /* ขึ้นบรรทัดใหม่เมื่อข้อความยาว */
        }

        .message {
            margin-bottom: 10px;
            line-height: 1.4;
            display: inline-block;
            clear: both;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 80%;
            word-break: break-word;
        }

        .user {
            float: right;
            background-color: #6b0405;
            color: #fff;
            text-align: right;
            font-size: 1.6rem;
        }

        .bot {
            float: left;
            background-color: #eee;
            color: #000;
            text-align: left;
            font-size: 1.6rem;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 1.6rem;
        }

        .input-area button {
            background: #6b0405;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1.6rem;
        }

        /* scrollbar สวยๆ */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 5rem;
        }

        .btn {
            color: var(--bg-white);
            background: #6B0405;
            border: .3rem solid var(--bg-white);
            border-radius: 3.5rem;
            padding: 1rem 3.5rem;
            font-size: 2.4rem;
            font-weight: 600;
            margin: 4rem auto 0;
            letter-spacing: .2rem;
            width: fit-content;
        }

        .btn:hover {
            background: var(--bg-white);
            color: #6B0405;
            border: .3rem solid #6B0405;
        }
    </style>

    <!-- JS สำหรับ Chatbot -->
    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('userInput');

        const replies = {
            "A": "BCD",
            "สวัสดี": "สวัสดีครับ! llll",
            "ทำไมถึงอยากเข้าคณะวิศวกรรมศาสตร์": "เพราะมันเป็นความฝันของผมมาตั้งแต่เด็กแล้วล่ะครับ!",
            "ชื่ออะไร": "เราเป็น Chatbot Portfolio ของเทป",
            "ทำอะไรได้บ้าง": "เราตอบคำถามง่าย ๆ แนะนำ portfolio และโชว์แรงบันดาลใจเกี่ยวกับ AI 😎",
            "แรงบันดาลใจ": "แรงบันดาลใจของเราคือการเรียนรู้และสร้างสิ่งใหม่ ๆ",
            "ผลงาน": "ลองดูหน้า Project ของเรา มีหลายโปรเจกต์ที่น่าสนใจ!",
            "ชอบอะไร": "เราชอบออกแบบเว็บและทดลองพัฒนา AI เล่นเกมก็ชอบ 😆",
            "เรียนอะไร": "เราเรียนวิศวกรรมศาสตร์และสนใจด้าน AI 🤖"
        };

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender);
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function getReply(text) {
            const lowerText = text.toLowerCase();
            for (let key in replies) {
                if (lowerText.includes(key)) return replies[key];
            }
            return "ขอโทษนะครับ ผมยังไม่ค่อยเก่งเท่าไหร่ ยังตอบกลับคำนี้ไม่ได้นะครับ";
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            const reply = await getReply(text);
            addMessage(reply, 'bot');
        }

        input.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        // เริ่มแชทด้วยข้อความต้อนรับ
        addMessage("สวัสดีครับ ผมชื่อ นายเทพทัด ชัยทรัยพ์ เป็น Bot นะครับ!", "bot");
        addMessage("อยากคุยกับผมลองพิมพ์ตามนี้ดูนะครับ", "bot");
        addMessage("-ทำไมถึงอยากเข้าคณะวิศวกรรมศาสตร์", "bot");
    </script>
